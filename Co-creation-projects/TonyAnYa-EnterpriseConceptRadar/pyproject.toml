[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "enterprise-concept-radar"
version = "0.1.0"
description = "能源政策新词新概念追踪与知识治理智能体"
readme = "README.md"
requires-python = ">=3.10,<3.13"

authors = [
    { name = "TonyAnYa" },
]

dependencies = [
    "hello-agents[evaluation]==0.2.9",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
]


[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
]

dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
]


[project.scripts]
concept-radar = "enterprise_concept_radar.cli:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = [
    "enterprise_concept_radar",
    "enterprise_concept_radar.*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]


[tool.ruff]
target-version = "py310"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]